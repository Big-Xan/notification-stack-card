name: Feature Request
description: Suggest something new for Notification Stack Card
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Requests shape what gets built next.

        Before submitting, please check the README's options and examples, and the existing issues.

  - type: dropdown
    id: area
    attributes:
      label: Which area does this relate to?
      multiple: true
      options:
        - Alert rules / matching
        - Stack layout and sizing
        - Dismiss and snooze
        - Action buttons
        - Groups, quiet hours and zones
        - Templates
        - Visual editor
        - Theme / styling
        - New option
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve for you?
      description: Describe the setup or situation where you'd use it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Have you found any workarounds?

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to your setup?
      options:
        - Nice to have
        - Would use it regularly
        - Would significantly improve my setup
        - Blocking me from using the card
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Mockups, examples from other cards, etc.
